[package]
name = "deskunion-app"
description = "Software KVM Switch / mouse & keyboard sharing software for Local Area Networks"
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/luminusOS/deskunion"

[lib]
name = "deskunion"
path = "src/lib.rs"

[[bin]]
name = "deskunion"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.11"
shadow-rs = "1.2.0"

[dependencies]
input-event = { path = "../input-event", version = "0.4.0" }
input-emulation = { path = "../input-emulation", version = "0.4.0", default-features = false }
input-capture = { path = "../input-capture", version = "0.4.0", default-features = false }
deskunion-cli = { path = "../deskunion-cli", version = "0.3.0" }
deskunion-gtk = { path = "../deskunion-gtk", version = "0.3.0", optional = true }
deskunion-ipc = { path = "../deskunion-ipc", version = "0.6.0" }
deskunion-proto = { path = "../deskunion-proto", version = "0.4.0" }
deskunion-audio = { path = "../deskunion-audio", version = "0.1.0", optional = true }
shadow-rs = { version = "1.2.0", features = ["metadata"] }

toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11.3"
serde_json = "1.0.107"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "signal",
] }
futures = "0.3.28"
clap = { version = "4.4.11", features = ["derive"] }
slab = "0.4.9"
thiserror = "2.0.0"
tokio-util = "0.7.11"
local-channel = "0.1.5"
webrtc-dtls = { version = "0.12.0", features = ["pem"] }
webrtc-util = "0.11.0"
rustls = { version = "0.23.12", default-features = false, features = [
    "std",
    "ring",
] }
rcgen = "0.13.1"
sha2 = "0.10.8"
notify = "8.2.0"

[dev-dependencies]
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

[features]
default = [
    "gtk",
    "audio",
    "layer_shell_capture",
    "x11_capture",
    "libei_capture",
    "wlroots_emulation",
    "libei_emulation",
    "rdp_emulation",
    "x11_emulation",
]
gtk = ["dep:deskunion-gtk"]
audio = ["dep:deskunion-audio"]
layer_shell_capture = ["input-capture/layer_shell"]
x11_capture = ["input-capture/x11"]
libei_capture = ["input-event/libei", "input-capture/libei"]
libei_emulation = ["input-event/libei", "input-emulation/libei"]
wlroots_emulation = ["input-emulation/wlroots"]
x11_emulation = ["input-emulation/x11"]
rdp_emulation = ["input-emulation/remote_desktop_portal"]

[package.metadata.bundle]
name = "Deskunion"
icon = ["../../target/icon.icns", "../deskunion-gtk/resources/io.github.luminusos.DeskUnion.svg"]
identifier = "io.github.luminusos.DeskUnion"
deb_depends = ["libadwaita-1-0"]
osx_info_plist_exts = ["../../build-aux/macos-lsui-element.plist"]
resources = ["../../target/menubar-template.png"]
