[package]
name = "deskunion-gtk"
description = "GTK4 / Libadwaita Frontend for deskunion"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/luminusOS/deskunion"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
relm4 = { version = "0.11.0", features = ["libadwaita"] }
async-channel = { version = "2.1.1" }
hostname = "0.4.0"
log = "0.4.20"
deskunion-ipc = { path = "../deskunion-ipc", version = "0.7.0" }
thiserror = "2.0.0"

[build-dependencies]
glib-build-tools = { version = "0.20.0" }
