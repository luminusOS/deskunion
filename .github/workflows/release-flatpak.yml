name: Release Flatpak

on:
  workflow_call:

jobs:
  flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Read release metadata
        id: names
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          APP_VERSION="$(
            python3 -c 'import pathlib, tomllib; data = tomllib.loads(pathlib.Path("crates/deskunion-app/Cargo.toml").read_text()); print(data["package"]["version"])'
          )"

          if [ "$BASE_VERSION" != "$APP_VERSION" ]; then
            echo "Tag ${TAG} does not match deskunion-app version ${APP_VERSION}." >&2
            exit 1
          fi

          if ! grep -q "<release version=\"${APP_VERSION}\"" io.github.luminusos.DeskUnion.metainfo.xml; then
            echo "io.github.luminusos.DeskUnion.metainfo.xml has no <release> for ${APP_VERSION}." >&2
            exit 1
          fi

          case "$TAG" in
            *-rc*) BRANCH=testing ;;
            *) BRANCH=stable ;;
          esac

          mkdir -p dist
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=deskunion-${VERSION}-linux-${{ matrix.arch }}.flatpak" >> "$GITHUB_OUTPUT"

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        env:
          BRANCH: ${{ steps.names.outputs.branch }}
          BUNDLE: ${{ steps.names.outputs.bundle_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          flatpak-builder \
            --user \
            --force-clean \
            --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --default-branch="${BRANCH}" \
            --repo=target/flatpak/repo \
            target/flatpak/build \
            build-aux/io.github.luminusos.DeskUnion.yml
          flatpak build-bundle \
            --arch="${ARCH}" \
            target/flatpak/repo \
            "dist/${BUNDLE}" \
            io.github.luminusos.DeskUnion \
            "${BRANCH}"

      - name: Verify the bundle ref
        env:
          BRANCH: ${{ steps.names.outputs.branch }}
          BUNDLE: ${{ steps.names.outputs.bundle_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          check="$(mktemp -d)"
          ostree init --repo="${check}/repo" --mode=archive-z2
          flatpak build-import-bundle --no-update-summary "${check}/repo" "dist/${BUNDLE}"
          test "$(ostree refs --repo="${check}/repo" --list)" = "app/io.github.luminusos.DeskUnion/${ARCH}/${BRANCH}"
          rm -rf "${check}"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/${{ steps.names.outputs.bundle_name }}
          if-no-files-found: error
