name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: cargo fmt
        run: cargo fmt --check

  ci:
    name: ${{ matrix.job }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
        job:
          - build
          - check
          - clippy
          - test
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libx11-dev libxtst-dev libadwaita-1-dev libgtk-4-dev libpipewire-0.3-dev libopus-dev libclang-dev libasound2-dev
      - name: Install Linux test display
        if: runner.os == 'Linux' && matrix.job == 'test'
        run: sudo apt-get install -y xvfb dbus-x11
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install gtk4 libadwaita imagemagick opus pkgconf
      - name: Record macOS native lib versions for cache key
        if: runner.os == 'macOS'
        run: |
          echo "MACOS_LIB_VER=$(brew list --versions glib gtk4 libadwaita | tr '\n' '_')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ env.MACOS_LIB_VER }}
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          path-type: inherit
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-gtk4
            mingw-w64-clang-x86_64-libadwaita
            mingw-w64-clang-x86_64-librsvg
            mingw-w64-clang-x86_64-opus
            mingw-w64-clang-x86_64-pkg-config
            mingw-w64-clang-x86_64-toolchain
      - name: Install Rust (Windows gnullvm)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          rustup toolchain install stable-x86_64-pc-windows-gnullvm --profile minimal -c clippy
          # gnullvm host too: build scripts (glib-build-tools) must link against MSYS2 GLib, not MSVC.
          {
            echo "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnullvm"
            echo "PKG_CONFIG_PATH=/clang64/lib/pkgconfig"
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=clang"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "OPUS_LIB_DIR=$(cygpath -m /clang64)"
            echo "CMAKE_POLICY_VERSION_MINIMUM=3.5"
          } >> "$(cygpath -u "$GITHUB_ENV")"
      - name: cargo build
        if: matrix.job == 'build'
        run: cargo build

      - name: cargo check
        if: matrix.job == 'check'
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test (Linux graphical display)
        if: matrix.job == 'test' && runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run -a cargo test --workspace --all-features

      - name: cargo test
        if: matrix.job == 'test' && runner.os != 'Linux'
        run: cargo test --workspace --all-features

      - name: cargo clippy
        if: matrix.job == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: clechasseur/rs-clippy-check@v4
        if: matrix.job == 'clippy' && runner.os != 'Windows'
        with:
          args: --workspace --all-targets --all-features
