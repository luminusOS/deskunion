name: Release Android

on:
  workflow_call:
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: debian:sid
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android
      ANDROID_SDKVER: "35.0.0"
      ANDROID_NDKVER: "29.0.14206865"
      GOOGLE_RUST_BRANCH: "android-17.0.0_r1"
      RUST_VERSION: "1.93.1"
      LANG: "C.UTF-8"
    steps:
      - name: Install system packages
        run: |
          apt-get -y update && apt-get -y upgrade
          apt-get -y install --no-install-recommends \
            build-essential gir1.2-appstream git glslc gobject-introspection \
            libglib2.0-dev-bin libglib-perl libglib-object-introspection-perl \
            libipc-run-perl libjson-perl libset-scalar-perl libxml2-utils \
            libxml-libxml-perl libxml-libxslt-perl meson ninja-build \
            openjdk-21-jre openjdk-21-jdk perl sassc sdkmanager \
            appstream desktop-file-utils gettext cargo python3 python3-gi \
            gir1.2-gtk-4.0 libadwaita-1-dev gir1.2-adw-1 pkg-config python3-dev curl
          apt-get -y clean

      - name: Check out sources
        uses: actions/checkout@v6

      - name: Read release metadata
        id: names
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME:-v0.2.11}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          APP_VERSION="$(
            python3 -c 'import pathlib, tomllib; data = tomllib.loads(pathlib.Path("crates/deskunion-app/Cargo.toml").read_text()); print(data["package"]["version"])'
          )"

          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK & Licenses
        run: |
          mkdir -p "${HOME}/.android" "${ANDROID_HOME}/licenses"
          echo 'count=0' > "${HOME}/.android/repositories.cfg"
          cat <<'EOF' > "${HOME}/.android/sites-settings.cfg"
          @version@=1
          @disabled@https\://dl.google.com/android/repository/extras/intel/addon.xml=disabled
          @disabled@https\://dl.google.com/android/repository/glass/addon.xml=disabled
          @disabled@https\://dl.google.com/android/repository/sys-img/android/sys-img.xml=disabled
          @disabled@https\://dl.google.com/android/repository/sys-img/android-tv/sys-img.xml=disabled
          @disabled@https\://dl.google.com/android/repository/sys-img/android-wear/sys-img.xml=disabled
          @disabled@https\://dl.google.com/android/repository/sys-img/google_apis/sys-img.xml=disabled
          EOF
          cat <<'EOF' > "${ANDROID_HOME}/licenses/android-sdk-license"
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          cat <<'EOF' > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF
          cat <<'EOF' > "${ANDROID_HOME}/licenses/android-sdk-preview-license-old"
          79120722343a6f314e0719f863036c702b0e6b2a
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF
          cat <<'EOF' > "${ANDROID_HOME}/licenses/intel-android-extra-license"
          d975f751698a77b662f1254ddbeed3901e976f5a
          EOF
          ANDROID_SDKMAJOR=$(echo "${ANDROID_SDKVER}" | awk -F '.' '{print $1}')
          sdkmanager --sdk_root="${ANDROID_HOME}" "build-tools;${ANDROID_SDKVER}" "ndk;${ANDROID_NDKVER}" "platforms;android-${ANDROID_SDKMAJOR}"

      - name: Fetch prebuilt Android Rust Toolchain
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/rust-toolchain/linux-x86 --branch=${GOOGLE_RUST_BRANCH} /opt/rust/
          git -C /opt/rust/ sparse-checkout set ${RUST_VERSION}
          rm -rf /opt/rust/.git

      - name: Fetch build tools (mini-studio, meson cargo-env, pixiewood)
        run: |
          git clone https://github.com/sp1ritCS/mini-studio.git --depth 1 /opt/mini-studio
          git clone https://github.com/TitouanReal/meson.git --branch cargo-env --depth 1 meson
          git clone https://github.com/sp1ritCS/gtk-android-builder.git --branch android35 --depth 1 pixiewood

      - name: Build and sign Android APK
        run: |
          ./build-aux/android/build-apk.sh

      - name: Stage APKs for release
        run: |
          mkdir -p dist
          find apks/ -name '*.apk' -exec cp {} dist/ \;

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 1
