name: Release macOS

on:
  workflow_call:

jobs:
  macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Read release metadata
        id: names
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          APP_VERSION="$(
            python3 -c 'import pathlib, tomllib; data = tomllib.loads(pathlib.Path("crates/deskunion-app/Cargo.toml").read_text()); print(data["package"]["version"])'
          )"

          if [ "$BASE_VERSION" != "$APP_VERSION" ]; then
            echo "Tag ${TAG} does not match deskunion-app version ${APP_VERSION}." >&2
            exit 1
          fi

          echo "dmg_name=deskunion-${VERSION}-macos-${{ matrix.arch }}.dmg" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          brew update
          brew install \
            create-dmg \
            gtk4 \
            imagemagick \
            libadwaita \
            librsvg \
            opus \
            pkgconf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build app bundle
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          scripts/makeicns.sh

          cargo build --release --locked
          cargo bundle --release --package deskunion-app

          app_bundle="target/release/bundle/osx/Deskunion.app"
          if [ ! -d "$app_bundle" ]; then
            echo "cargo-bundle did not produce Deskunion.app." >&2
            exit 1
          fi

          # Menu bar app: cargo-bundle cannot merge extra Info.plist keys.
          plist="$app_bundle/Contents/Info.plist"
          pb=/usr/libexec/PlistBuddy
          $pb -c "Add :LSUIElement bool true" "$plist"
          $pb -c "Add :NSAppSleepDisabled bool true" "$plist"
          $pb -c "Add :NSInputMonitoringUsageDescription string 'DeskUnion needs Input Monitoring access to capture keyboard and mouse input and forward it to remote machines on your network.'" "$plist"
          $pb -c "Add :NSAppleEventsUsageDescription string 'DeskUnion uses Apple Events to deliver synthesized keyboard and mouse events to the system.'" "$plist"

          scripts/copy-macos-dylib.sh "$app_bundle/Contents/MacOS/deskunion"

          mkdir -p dist
          rm -f "dist/${{ steps.names.outputs.dmg_name }}"
          create-dmg \
            --volname "DeskUnion" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "dist/${{ steps.names.outputs.dmg_name }}" \
            "$app_bundle"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/${{ steps.names.outputs.dmg_name }}
          retention-days: 1
