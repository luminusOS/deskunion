name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  flatpak:
    uses: ./.github/workflows/release-flatpak.yml

  appimage:
    uses: ./.github/workflows/release-appimage.yml

  macos:
    uses: ./.github/workflows/release-macos.yml

  windows:
    uses: ./.github/workflows/release-windows.yml

  android:
    uses: ./.github/workflows/release-android.yml

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [flatpak, appimage, windows, android]
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{flatpak-*,appimage-*,windows-*,android-*}'
          merge-multiple: true

      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  release-macos:
    name: Attach macOS assets
    runs-on: ubuntu-latest
    needs: [release, macos]
    steps:
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: macos-*
          merge-multiple: true

      - name: Create macOS checksums
        run: cd dist && sha256sum *.dmg > SHA256SUMS-macos.txt

      - name: Attach macOS assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
