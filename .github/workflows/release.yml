name: "Release"
run-name: "Release - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.name || github.ref_name }}"

on:
  push:
    branches: [ "main" ]
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: 'Development release name'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
        sudo apt-get install libadwaita-1-dev libgtk-4-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/deskunion deskunion-linux-x86_64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: deskunion-linux-x86_64
        path: |
          deskunion-linux-x86_64
          target/release/bundle/deb/deskunion_*.deb
          target/release/bundle/appimage/deskunion_*.AppImage

  linux-arm64-release-build:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
        sudo apt-get install libadwaita-1-dev libgtk-4-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/deskunion deskunion-linux-arm64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: deskunion-linux-arm64
        path: |
          deskunion-linux-arm64
          target/release/bundle/deb/deskunion_*.deb
          target/release/bundle/appimage/deskunion_*.AppImage

  windows-release-build:
    runs-on: windows-latest
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # needed for cache restore
    - name: create gtk dir
      run: mkdir C:\gtk-build\gtk\x64\release
    - uses: actions/cache@v3
      id: cache
      with:
        path: c:/gtk-build/gtk/x64/release/**
        key: gtk-windows-build
        restore-keys: gtk-windows-build
    - name: Update path
      run: |
        echo "PKG_CONFIG=C:\gtk-build\gtk\x64\release\bin\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "C:\pkg-config-lite-0.28-1\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo $env:GITHUB_PATH
        echo $env:PATH
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        # choco install msys2
        # choco install visualstudio2022-workload-vctools
        # choco install pkgconfiglite
        py -m venv .venv
        .venv\Scripts\activate.ps1
        py -m pip install gvsbuild
        # see https://github.com/wingtk/gvsbuild/pull/1004
        Move-Item "C:\Program Files\Git\usr\bin" "C:\Program Files\Git\usr\notbin"
        Move-Item "C:\Program Files\Git\bin" "C:\Program Files\Git\notbin"
        gvsbuild build --msys-dir=C:\msys64 gtk4 libadwaita librsvg
        Move-Item "C:\Program Files\Git\usr\notbin" "C:\Program Files\Git\usr\bin"
        Move-Item "C:\Program Files\Git\notbin" "C:\Program Files\Git\bin"
    - uses: actions/checkout@v6
    - name: Release Build
      run: cargo build --release
    - name: Create Archive
      run: |
        $runtime = "C:\gtk-build\gtk\x64\release"
        New-Item -ItemType Directory -Force -Path "deskunion-windows\bin", "deskunion-windows\share", "deskunion-windows\lib" | Out-Null
        Get-Childitem -Path "$runtime\bin\*.dll" -File -Recurse | Copy-Item -Destination "deskunion-windows\bin"
        Copy-Item -Path "target\release\deskunion.exe" -Destination "deskunion-windows\bin"
        Copy-Item -Recurse -Force -ErrorAction SilentlyContinue "$runtime\share\glib-2.0" "deskunion-windows\share\"
        Copy-Item -Recurse -Force -ErrorAction SilentlyContinue "$runtime\share\icons" "deskunion-windows\share\"
        Copy-Item -Recurse -Force -ErrorAction SilentlyContinue "$runtime\share\themes" "deskunion-windows\share\"
        Copy-Item -Recurse -Force -ErrorAction SilentlyContinue "$runtime\lib\gdk-pixbuf-2.0" "deskunion-windows\lib\"
        Copy-Item -Recurse -Force -ErrorAction SilentlyContinue "$runtime\lib\gio" "deskunion-windows\lib\"
        & "$runtime\bin\glib-compile-schemas.exe" "deskunion-windows\share\glib-2.0\schemas"
        Compress-Archive -Path "deskunion-windows" -DestinationPath deskunion-windows-x86_64.zip
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: deskunion-windows-x86_64
        path: deskunion-windows-x86_64.zip

  macos-release-build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install gtk4 libadwaita imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/deskunion deskunion-macos-intel
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/Deskunion.app/Contents/MacOS/deskunion"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "deskunion-macos-intel.zip" "Deskunion.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: deskunion-macos-intel
        path: target/release/bundle/osx/deskunion-macos-intel.zip

  macos-arm64-release-build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install gtk4 libadwaita imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/deskunion deskunion-macos-arm64
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/Deskunion.app/Contents/MacOS/deskunion"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "deskunion-macos-arm64.zip" "Deskunion.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: deskunion-macos-arm64
        path: target/release/bundle/osx/deskunion-macos-arm64.zip

  release:
    name: "Release"
    needs: [windows-release-build, linux-release-build, linux-arm64-release-build, macos-release-build, macos-arm64-release-build]
    runs-on: "ubuntu-latest"
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - name: Get short SHA
      id: vars
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - name: Create Pre-Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        prerelease: true
        generate_release_notes: true
        files: |
          deskunion-linux-x86_64/deskunion-linux-x86_64
          deskunion-linux-x86_64/target/release/bundle/deb/deskunion_*.deb
          deskunion-linux-x86_64/target/release/bundle/appimage/deskunion_*.AppImage
          deskunion-linux-arm64/deskunion-linux-arm64
          deskunion-linux-arm64/target/release/bundle/deb/deskunion_*.deb
          deskunion-linux-arm64/target/release/bundle/appimage/deskunion_*.AppImage
          deskunion-macos-intel/deskunion-macos-intel.zip
          deskunion-macos-arm64/deskunion-macos-arm64.zip
          deskunion-windows-x86_64/deskunion-windows-x86_64.zip
    - name: Create Tagged Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          deskunion-linux-x86_64/deskunion-linux-x86_64
          deskunion-linux-x86_64/target/release/bundle/deb/deskunion_*.deb
          deskunion-linux-x86_64/target/release/bundle/appimage/deskunion_*.AppImage
          deskunion-linux-arm64/deskunion-linux-arm64
          deskunion-linux-arm64/target/release/bundle/deb/deskunion_*.deb
          deskunion-linux-arm64/target/release/bundle/appimage/deskunion_*.AppImage
          deskunion-macos-intel/deskunion-macos-intel.zip
          deskunion-macos-arm64/deskunion-macos-arm64.zip
          deskunion-windows-x86_64/deskunion-windows-x86_64.zip
